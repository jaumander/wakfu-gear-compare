<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wakfu Gear Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141d;
    --surface:#1b1e2a;
    --surface-2:#232738;
    --border:#2e3245;
    --text:#e7e9f0;
    --text-muted:#8b8fa3;
    --reliquia:#d4af37;
    --epico:#a67bdb;
    --ok:#35c79a;
    --danger:#e2596b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:1600px;margin:0 auto;padding:2rem clamp(1rem,3vw,3rem) 4rem;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.6rem;
    margin:0 0 .25rem;
    letter-spacing:-.01em;
  }
  .subtitle{color:var(--text-muted);font-size:.9rem;margin:0 0 1.75rem;}
  .status{font-size:.82rem;color:var(--text-muted);margin-bottom:1.5rem;}
  .status.error{color:var(--danger);}
  .status.ok{color:var(--ok);}

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:1.1rem 1.25rem;
    margin-bottom:1.25rem;
  }
  .panel h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:1rem;
    font-weight:500;
    margin:0 0 .9rem;
    color:var(--text);
  }

  .search-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem;}
  input[type=text], select{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:.5rem .7rem;
    font-size:.88rem;
    font-family:inherit;
  }
  input[type=text]{flex:1;min-width:180px;}
  select{min-width:150px;}
  input[type=text]:focus, select:focus{outline:1px solid var(--ok);}

  .results-list{max-height:230px;overflow-y:auto;border-top:1px solid var(--border);}
  .result-row{
    display:flex;align-items:center;gap:.6rem;
    padding:.5rem .1rem;border-bottom:1px solid var(--border);
    font-size:.85rem;
  }
  .result-row .nombre{flex:1;}
  .result-row .nivel{color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:.78rem;width:52px;}
  .tag{
    font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:4px;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .tag.reliquia{background:rgba(212,175,55,.15);color:var(--reliquia);}
  .tag.epico{background:rgba(166,123,219,.15);color:var(--epico);}
  button{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:.4rem .8rem;
    font-size:.82rem;
    cursor:pointer;
    font-family:inherit;
  }
  button:hover{border-color:var(--ok);}
  button.add{color:var(--ok);border-color:var(--ok);}
  button.primary{
    background:var(--ok);color:#0a1f18;font-weight:600;border:none;
    padding:.6rem 1.1rem;font-size:.9rem;
  }
  button.primary:hover{opacity:.9;}
  button.remove{color:var(--danger);border-color:var(--danger);padding:.25rem .5rem;font-size:.75rem;}

  .slots{display:flex;flex-direction:column;gap:.9rem;}
  .slot{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:.75rem .9rem;
  }
  .slot-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
  .slot-header input[type=text]{max-width:220px;font-weight:500;}
  .candidate-list{display:flex;flex-direction:column;gap:.35rem;}
  .candidate{
    display:flex;align-items:center;gap:.5rem;
    background:var(--surface);border:1px solid var(--border);border-radius:6px;
    padding:.4rem .6rem;font-size:.85rem;
  }
  .candidate .nombre{flex:1;}
  .empty-hint{color:var(--text-muted);font-size:.8rem;padding:.3rem 0;}

  .toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:.5rem;}
  .toolbar select{min-width:180px;}

  .combo-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:.9rem 1rem;
    margin-bottom:.75rem;
  }
  .combo-card.best{border-color:var(--ok);}
  .combo-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;}
  .combo-title .rank{font-family:'JetBrains Mono',monospace;color:var(--text-muted);font-size:.78rem;}
  .compare-toggle{display:flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--text-muted);cursor:pointer;}
  .compare-toggle input{cursor:pointer;}
  .compare-hint{color:var(--text-muted);font-size:.85rem;margin-bottom:1rem;}
  .compare-panel{
    background:var(--surface);
    border:1px solid var(--ok);
    border-radius:10px;
    padding:1.1rem 1.25rem 1.25rem;
    margin-bottom:1.25rem;
  }
  .compare-panel h3{
    font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:700;margin:0 0 .9rem;
  }
  .compare-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:.8rem 1rem;
    margin-bottom:.4rem;
  }
  .compare-card.compare-a{border-left:4px solid var(--epico);}
  .compare-card.compare-b{border-left:4px solid var(--ok);}
  .compare-card-label{
    font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;
    color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem;
  }
  .compare-arrow{text-align:center;color:var(--text-muted);font-size:1.2rem;margin:.15rem 0 .5rem;}
  .compare-diff-section{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);}
  .compare-diff-title{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.92rem;margin-bottom:.6rem;
  }
  .diff-row{
    display:flex;justify-content:space-between;align-items:center;gap:.5rem;
    background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
    padding:.4rem .6rem;font-size:.85rem;
  }
  .diff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.5rem .7rem;}
  .diff-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.85rem;white-space:nowrap;}
  .diff-val.positive{color:var(--ok);}
  .diff-val.negative{color:var(--danger);}
  .combo-items{font-size:.85rem;color:var(--text);margin-bottom:.6rem;}
  .combo-items .slot-name{color:var(--text-muted);}
  .stats-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:.4rem .8rem;
  }
  .stat{font-family:'JetBrains Mono',monospace;font-size:.8rem;display:flex;justify-content:space-between;}
  .stat .v{font-weight:600;}
  .empty-state{color:var(--text-muted);font-size:.88rem;text-align:center;padding:1.5rem 0;}

  .stat-clickable{cursor:pointer;}
  .stat-clickable:hover{border:1px solid var(--ok);border-radius:4px;margin:-1px;}
  .info-dot{color:var(--text-muted);font-size:.72rem;}

  .modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(8,9,14,.65);
    align-items:center;justify-content:center;z-index:50;padding:1rem;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:1.1rem 1.25rem;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;
  }
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;}
  .modal-header h3{font-family:'Space Grotesk',sans-serif;font-size:1rem;margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Wakfu gear compare</h1>
  <p class="subtitle">Compara todas las combinaciones válidas de tus candidatos (máx. 1 reliquia y máx. 1 épico a la vez).</p>
  <p class="status" id="status">Cargando dataset...</p>

  <div class="panel">
    <h2>Buscar objetos</h2>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Nombre del objeto (ej. amuleto del dragón)">
      <select id="slot-filter"><option value="">Todos los slots</option></select>
      <select id="level-filter"><option value="">Todos los niveles</option></select>
    </div>
    <div class="results-list" id="results-list"></div>
  </div>

  <div class="panel">
    <h2>Candidatos</h2>
    <div class="slots" id="slots"></div>
    <div class="toolbar">
      <button id="add-slot-btn">+ Añadir slot (ej. Anillo 2)</button>
    </div>
  </div>

  <div class="panel">
    <h2>Comparar</h2>
    <div class="toolbar">
      <button class="primary" id="compare-btn">Calcular combinaciones válidas</button>
      <select id="sort-select"><option value="">Ordenar por...</option></select>
    </div>
  </div>

  <div id="results-panel"></div>
</div>

<div class="modal-backdrop" id="breakdown-modal-backdrop" onclick="if(event.target===this) closeBreakdown()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="breakdown-modal-title">Desglose</h3>
      <button class="remove" onclick="closeBreakdown()">Cerrar</button>
    </div>
    <div class="stats-grid" id="breakdown-modal-list"></div>
  </div>
</div>

<script>
const RAW_URL = "https://raw.githubusercontent.com/jaumander/wakfu-gear-compare/main/items_reduced.json";

let items = [];
let slotLabels = [];
let candidatesBySlot = {};
let lastResults = [];
let compareSelection = [];

const statusEl = document.getElementById('status');
const searchInput = document.getElementById('search-input');
const slotFilter = document.getElementById('slot-filter');
const levelFilter = document.getElementById('level-filter');
const resultsList = document.getElementById('results-list');
const slotsEl = document.getElementById('slots');
const sortSelect = document.getElementById('sort-select');
const resultsPanel = document.getElementById('results-panel');

fetch(RAW_URL)
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    items = data;
    statusEl.textContent = items.length + ' objetos cargados desde GitHub.';
    statusEl.className = 'status ok';
    setupSlotFilter();
    setupLevelFilter();
    setupSortOptions();
    slotLabels = ['Slot 1', 'Slot 2'];
    slotLabels.forEach(s => candidatesBySlot[s] = []);
    renderSlots();
  })
  .catch(err => {
    statusEl.textContent = 'No se pudo cargar items_reduced.json desde GitHub (' + err.message + '). Comprueba tu conexión.';
    statusEl.className = 'status error';
  });

function setupSlotFilter(){
  const slots = [...new Set(items.map(it => it.slot))].sort();
  slots.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    slotFilter.appendChild(opt);
  });
}

function levelRanges(){
  // 1-20, y luego cada 15 niveles hasta 245
  const ranges = [[1, 20]];
  for (let start = 21; start <= 245; start += 15){
    ranges.push([start, start + 14]);
  }
  return ranges;
}

function setupLevelFilter(){
  levelRanges().forEach(([lo, hi]) => {
    const opt = document.createElement('option');
    opt.value = lo + '-' + hi;
    opt.textContent = 'Nivel ' + lo + '-' + hi;
    levelFilter.appendChild(opt);
  });
}

function setupSortOptions(){
  const stats = new Set();
  items.forEach(it => Object.keys(it.stats).forEach(k => stats.add(k)));
  [...stats].sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sortSelect.appendChild(opt);
  });
}

function doSearch(){
  const q = searchInput.value.trim().toLowerCase();
  const slot = slotFilter.value;
  const levelRange = levelFilter.value;
  resultsList.innerHTML = '';
  if (!q){ return; }
  let lo = null, hi = null;
  if (levelRange){
    [lo, hi] = levelRange.split('-').map(Number);
  }
  const matches = items.filter(it =>
    it.nombre.toLowerCase().includes(q)
    && (!slot || it.slot === slot)
    && (lo === null || (it.nivel >= lo && it.nivel <= hi))
  ).slice(0, 60);
  if (matches.length === 0){
    resultsList.innerHTML = '<div class="empty-hint">Sin resultados.</div>';
    return;
  }
  matches.forEach(it => {
    const row = document.createElement('div');
    row.className = 'result-row';
    const tag = it.es_reliquia ? '<span class="tag reliquia">Reliquia</span>'
              : it.es_epico ? '<span class="tag epico">Épico</span>' : '';
    row.innerHTML = `
      <span class="nombre">${it.nombre} ${tag}</span>
      <span class="nivel">nvl ${it.nivel}</span>
      <span class="nivel">${it.slot}</span>
    `;
    // Desplegable con los slots existentes, para elegir claramente a cuál
    // añadir el candidato. Si solo hay un slot se añade directo, sin desplegable.
    if (slotLabels.length > 1){
      const bucketSelect = document.createElement('select');
      bucketSelect.className = 'bucket-select';
      slotLabels.forEach(label => {
        const opt = document.createElement('option');
        opt.value = label;
        opt.textContent = label;
        bucketSelect.appendChild(opt);
      });
      const firstEmpty = slotLabels.find(label => (candidatesBySlot[label] || []).length === 0);
      bucketSelect.value = firstEmpty || slotLabels[0];
      row.appendChild(bucketSelect);
      const addBtn = document.createElement('button');
      addBtn.className = 'add';
      addBtn.textContent = '+ Añadir';
      addBtn.onclick = () => {
        candidatesBySlot[bucketSelect.value].push(it);
        renderSlots();
        doSearch();
      };
      row.appendChild(addBtn);
    } else {
      const addBtn = document.createElement('button');
      addBtn.className = 'add';
      addBtn.textContent = '+ Añadir';
      addBtn.onclick = () => {
        candidatesBySlot[slotLabels[0]].push(it);
        renderSlots();
      };
      row.appendChild(addBtn);
    }
    resultsList.appendChild(row);
  });
}
searchInput.addEventListener('input', doSearch);
slotFilter.addEventListener('change', doSearch);
levelFilter.addEventListener('change', doSearch);

function renderSlots(){
  slotsEl.innerHTML = '';
  slotLabels.forEach(label => {
    const slotDiv = document.createElement('div');
    slotDiv.className = 'slot';
    const header = document.createElement('div');
    header.className = 'slot-header';
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = label;
    nameInput.onchange = (e) => renameSlot(label, e.target.value);
    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove';
    removeBtn.textContent = 'Quitar slot';
    removeBtn.onclick = () => removeSlot(label);
    header.appendChild(nameInput);
    header.appendChild(removeBtn);
    slotDiv.appendChild(header);

    const list = document.createElement('div');
    list.className = 'candidate-list';
    const cands = candidatesBySlot[label] || [];
    if (cands.length === 0){
      list.innerHTML = '<div class="empty-hint">Sin candidatos. Busca arriba y pulsa "+ Añadir".</div>';
    } else {
      cands.forEach((it, i) => {
        const row = document.createElement('div');
        row.className = 'candidate';
        const tag = it.es_reliquia ? '<span class="tag reliquia">Reliquia</span>'
                  : it.es_epico ? '<span class="tag epico">Épico</span>' : '';
        row.innerHTML = `<span class="nombre">${it.nombre} ${tag}</span>`;
        const rm = document.createElement('button');
        rm.className = 'remove';
        rm.textContent = 'x';
        rm.onclick = () => { cands.splice(i,1); renderSlots(); };
        row.appendChild(rm);
        list.appendChild(row);
      });
    }
    slotDiv.appendChild(list);
    slotsEl.appendChild(slotDiv);
  });
}

function renameSlot(oldLabel, newLabel){
  newLabel = newLabel.trim();
  if (!newLabel || newLabel === oldLabel || slotLabels.includes(newLabel)) { renderSlots(); return; }
  const idx = slotLabels.indexOf(oldLabel);
  slotLabels[idx] = newLabel;
  candidatesBySlot[newLabel] = candidatesBySlot[oldLabel];
  delete candidatesBySlot[oldLabel];
  renderSlots();
  doSearch();
}

function removeSlot(label){
  slotLabels = slotLabels.filter(s => s !== label);
  delete candidatesBySlot[label];
  renderSlots();
  doSearch();
}

document.getElementById('add-slot-btn').onclick = () => {
  let n = 1;
  let name = 'Slot ' + (slotLabels.length + 1);
  while (slotLabels.includes(name)) { n++; name = 'Slot ' + (slotLabels.length + n); }
  slotLabels.push(name);
  candidatesBySlot[name] = [];
  renderSlots();
  doSearch();
};

function statIcon(name){
  const n = name.toLowerCase();
  if (n.includes('total')) return '🧮';
  if (n === 'pa' || n.includes('pa máx')) return '⭐';
  if (n === 'pm' || n.includes('pm máx')) return '👣';
  if (n.includes('pdv') || n.includes('vida')) return '❤️';
  if (n.includes('resistencia')) return '🛡️';
  if (n.includes('dominio')) return '⚔️';
  if (n.includes('esquiva')) return '💨';
  if (n.includes('placaje')) return '🪝';
  if (n.includes('crítico')) return '🎯';
  if (n.includes('anticipaci')) return '⏳';
  if (n.includes('alcance')) return '🏹';
  return '🔸';
}

function isValidCombo(combo){
  const relics = combo.filter(it => it.es_reliquia).length;
  const epics = combo.filter(it => it.es_epico).length;
  return relics <= 1 && epics <= 1;
}

function sumStats(combo){
  const total = {};
  combo.forEach(it => {
    Object.entries(it.stats).forEach(([k,v]) => {
      total[k] = (total[k] || 0) + v;
    });
  });
  return total;
}

// Las resistencias/dominios elementales de Ankama se dan de varias formas: específicas
// de un elemento (ej. "Resistencia al fuego", "Dominio de agua"), "de todos" (aplica a
// los 4 elementos siempre), "en N elementos" (aplica a N elementos sin especificar
// cuáles) o, en un puñado de objetos raros, sin número (tratado como 1 elemento sin
// especificar). Mostrar las 6-8 líneas sueltas junto al total es confuso, así que se
// pliegan todas en un único total ("Dominio/Resistencia elemental total") y el detalle
// de qué las compone se guarda aparte para un desglose bajo demanda (ver breakdown).
// Multiplicadores validados con datos reales: 234 vs 220 en el caso de prueba del usuario.
const RESISTENCIA_ELEMENTO_KEYS = ['Resistencia al agua', 'Resistencia al aire', 'Resistencia al fuego', 'Resistencia a la tierra'];
const DOMINIO_ELEMENTO_KEYS = ['Dominio de agua', 'Dominio de aire', 'Dominio de fuego', 'Dominio de tierra'];

function foldElementalStats(stats){
  const folded = {};
  const breakdown = { 'Resistencia elemental total': [], 'Dominio elemental total': [] };
  let resTotal = 0;
  let domTotal = 0;

  Object.entries(stats).forEach(([k, v]) => {
    let isResComponent = false;
    let isDomComponent = false;
    let resMult = 1;
    let domMult = 1;

    if (RESISTENCIA_ELEMENTO_KEYS.includes(k)) { isResComponent = true; }
    else if (k === 'Resistencia elemental (todos)') { isResComponent = true; resMult = 4; }
    else if (k === 'Resistencia elemental') { isResComponent = true; }
    else {
      const m = k.match(/^Resistencia elemental \((\d+) elementos\)$/);
      if (m) { isResComponent = true; resMult = parseInt(m[1], 10); }
    }

    if (DOMINIO_ELEMENTO_KEYS.includes(k)) { isDomComponent = true; }
    else if (k === 'Dominio elemental (todos)') { isDomComponent = true; domMult = 4; }
    else if (k === 'Dominio elemental') { isDomComponent = true; }
    else {
      const m2 = k.match(/^Dominio elemental \((\d+) elementos\)$/);
      if (m2) { isDomComponent = true; domMult = parseInt(m2[1], 10); }
    }

    if (isResComponent){
      resTotal += v * resMult;
      breakdown['Resistencia elemental total'].push({ stat: k, value: v });
    } else if (isDomComponent){
      domTotal += v * domMult;
      breakdown['Dominio elemental total'].push({ stat: k, value: v });
    } else {
      folded[k] = v;
    }
  });

  if (resTotal > 0) folded['Resistencia elemental total'] = resTotal;
  if (domTotal > 0) folded['Dominio elemental total'] = domTotal;

  return { stats: folded, breakdown };
}

const ELEMENTAL_TOTAL_KEYS = ['Resistencia elemental total', 'Dominio elemental total'];

// Registro de desgloses para el modal: cada total elemental clicado guarda aquí su
// lista de componentes, y el HTML solo referencia el índice (evita tener que serializar
// el desglose dentro del atributo onclick).
let breakdownRegistry = [];

function buildStatsGridHtml(r){
  return Object.entries(r.stats)
    .sort((a,b) => b[1]-a[1])
    .map(([k,v]) => {
      const rounded = Math.round(v*100)/100;
      if (ELEMENTAL_TOTAL_KEYS.includes(k) && r.breakdown && r.breakdown[k] && r.breakdown[k].length){
        const idx = breakdownRegistry.push({ title: k, entries: r.breakdown[k] }) - 1;
        return `<div class="stat stat-clickable" onclick="openBreakdown(${idx})"><span>${statIcon(k)} ${k} <span class="info-dot">ⓘ</span></span><span class="v">${rounded}</span></div>`;
      }
      return `<div class="stat"><span>${statIcon(k)} ${k}</span><span class="v">${rounded}</span></div>`;
    })
    .join('');
}

function openBreakdown(idx){
  const data = breakdownRegistry[idx];
  if (!data) return;
  document.getElementById('breakdown-modal-title').textContent = data.title;
  const list = document.getElementById('breakdown-modal-list');
  list.innerHTML = data.entries
    .filter(e => e.value !== 0)
    .sort((a,b) => b.value - a.value)
    .map(e => `<div class="stat"><span>${statIcon(e.stat)} ${e.stat}</span><span class="v">${Math.round(e.value*100)/100}</span></div>`)
    .join('') || '<div class="empty-hint">Sin componentes.</div>';
  document.getElementById('breakdown-modal-backdrop').style.display = 'flex';
}

function closeBreakdown(){
  document.getElementById('breakdown-modal-backdrop').style.display = 'none';
}

function cartesian(arrays){
  return arrays.reduce((acc, arr) => {
    const res = [];
    acc.forEach(a => arr.forEach(b => res.push([...a, b])));
    return res;
  }, [[]]);
}

document.getElementById('compare-btn').onclick = () => {
  const activeSlots = slotLabels.filter(s => (candidatesBySlot[s] || []).length > 0);
  if (activeSlots.length === 0){
    resultsPanel.innerHTML = '<div class="empty-state">Añade al menos un candidato en algún slot.</div>';
    return;
  }
  const optionLists = activeSlots.map(s => candidatesBySlot[s]);
  const combos = cartesian(optionLists).filter(isValidCombo);
  lastResults = combos.map(combo => {
    const { stats, breakdown } = foldElementalStats(sumStats(combo));
    return { labels: activeSlots, items: combo, stats, breakdown };
  });
  compareSelection = [];
  renderResults();
};
sortSelect.onchange = renderResults;

function renderResults(){
  if (lastResults.length === 0){
    resultsPanel.innerHTML = '<div class="empty-state">No hay combinaciones (o todas violan la regla de 1 reliquia / 1 épico).</div>';
    return;
  }
  breakdownRegistry = [];
  const sortBy = sortSelect.value;
  let sorted = [...lastResults];
  if (sortBy){
    sorted.sort((a,b) => (b.stats[sortBy]||0) - (a.stats[sortBy]||0));
  }
  resultsPanel.innerHTML = '';

  const hint = document.createElement('div');
  hint.className = 'compare-hint';
  hint.textContent = compareSelection.length === 2
    ? ''
    : 'Marca "Comparar" en dos combinaciones para ver aquí la diferencia de stats entre ellas.';
  if (hint.textContent) resultsPanel.appendChild(hint);

  const comparePanel = renderComparePanel();
  if (comparePanel) resultsPanel.appendChild(comparePanel);

  sorted.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'combo-card' + (i === 0 && sortBy ? ' best' : '');
    const itemsHtml = r.labels.map((label, idx) => {
      const it = r.items[idx];
      const tag = it.es_reliquia ? '<span class="tag reliquia">Reliquia</span>'
                : it.es_epico ? '<span class="tag epico">Épico</span>' : '';
      return `<div><span class="slot-name">${label}:</span> ${it.nombre} ${tag}</div>`;
    }).join('');
    const statsHtml = buildStatsGridHtml(r);
    card.innerHTML = `
      <div class="combo-title">
        <label class="compare-toggle"><input type="checkbox" class="compare-checkbox"> Comparar</label>
        <span class="rank">Combinación ${i+1} / ${sorted.length}</span>
      </div>
      <div class="combo-items">${itemsHtml}</div>
      <div class="stats-grid">${statsHtml}</div>
    `;
    const checkbox = card.querySelector('.compare-checkbox');
    checkbox.checked = compareSelection.includes(r);
    checkbox.onchange = () => toggleCompare(r);
    resultsPanel.appendChild(card);
  });
}

function toggleCompare(r){
  const idx = compareSelection.indexOf(r);
  if (idx !== -1){
    compareSelection.splice(idx, 1);
  } else {
    if (compareSelection.length >= 2) compareSelection.shift();
    compareSelection.push(r);
  }
  renderResults();
}

function renderComparePanel(){
  if (compareSelection.length !== 2) return null;
  const [a, b] = compareSelection;

  const buildItemsHtml = (r) => r.labels.map((label, idx) => {
    const it = r.items[idx];
    const tag = it.es_reliquia ? '<span class="tag reliquia">Reliquia</span>'
              : it.es_epico ? '<span class="tag epico">Épico</span>' : '';
    return `<div><span class="slot-name">${label}:</span> ${it.nombre} ${tag}</div>`;
  }).join('');

  const buildStatsHtml = (r) => buildStatsGridHtml(r);

  const statKeys = new Set([...Object.keys(a.stats), ...Object.keys(b.stats)]);
  const diffRows = [...statKeys]
    .map(k => ({ stat: k, diff: (b.stats[k] || 0) - (a.stats[k] || 0) }))
    .filter(r => r.diff !== 0)
    .sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));

  const diffHtml = diffRows.length
    ? '<div class="diff-grid">' + diffRows.map(r => {
        const cls = r.diff > 0 ? 'positive' : 'negative';
        const sign = r.diff > 0 ? '+' : '';
        return `<div class="diff-row"><span>${statIcon(r.stat)} ${r.stat}</span><span class="diff-val ${cls}">${sign}${Math.round(r.diff * 100) / 100}</span></div>`;
      }).join('') + '</div>'
    : '<div class="diff-row"><span>Ambas combinaciones dan exactamente los mismos stats.</span></div>';

  const panel = document.createElement('div');
  panel.className = 'compare-panel';
  panel.innerHTML = `
    <h3>Comparador</h3>
    <div class="compare-card compare-a">
      <div class="compare-card-label">Combinación A</div>
      <div class="combo-items">${buildItemsHtml(a)}</div>
      <div class="stats-grid">${buildStatsHtml(a)}</div>
    </div>
    <div class="compare-arrow">↓</div>
    <div class="compare-card compare-b">
      <div class="compare-card-label">Combinación B</div>
      <div class="combo-items">${buildItemsHtml(b)}</div>
      <div class="stats-grid">${buildStatsHtml(b)}</div>
    </div>
    <div class="compare-diff-section">
      <div class="compare-diff-title">Diferencia (B − A)</div>
      ${diffHtml}
    </div>
  `;
  return panel;
}
</script>
</body>
</html>
